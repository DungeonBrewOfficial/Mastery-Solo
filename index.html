<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mastery Solo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&family=IM+Fell+English&display=swap">
  <link rel="stylesheet" href="game/style.css">
</head>
<body>
  <header>
    <h1>Mastery Solo</h1>
    <span id="seed" class="muted"></span>
    <span id="saves" class="muted small"></span>
    <button id="new" class="quiet">New dynasty</button>
  </header>
  <div id="newgame" class="newgame" hidden>
    <p>Start a new dynasty? The current world and party will be lost.</p>
    <label for="seed-input">Seed (leave blank for a random world)</label>
    <input id="seed-input" inputmode="numeric" autocomplete="off">
    <div class="buttons"><button id="start-new" class="primary">Start a new dynasty</button><button id="cancel-new">Keep playing</button></div>
  </div>
  <div id="reactions" class="newgame" hidden></div>
  <main>
    <section class="map-wrap">
      <canvas id="map" aria-label="The map"></canvas>
      <div class="map-tools">
        <button id="zoom-in" title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">−</button>
        <button id="center" title="Center on the party">◎</button>
      </div>
      <div id="hover" class="hover"></div>
    </section>
    <aside>
      <div class="panel">
        <div class="row"><strong id="day"></strong> <span id="season" class="muted cap"></span></div>
        <div id="hours" class="muted"></div>
        <div id="weather"></div>
        <div id="here" class="here"></div>
      </div>
      <div id="event" class="panel event" hidden></div>
      <div class="panel">
        <label>Pace
          <select id="pace">
            <option value="slow">Slow</option>
            <option value="normal">Normal</option>
            <option value="fast">Fast</option>
            <option value="marathon">Marathon</option>
          </select>
        </label>
        <span id="pace-note" class="muted"></span>
        <button id="travel" class="primary"></button>
        <div id="choice" class="choice" hidden>
          <button id="stop">Stop at nightfall</button>
          <button id="push">Push on</button>
        </div>
        <button id="camp">Make camp</button>
        <p class="muted small">Space: travel a leg · C: make camp · drag to pan · wheel to zoom</p>
      </div>
      <details class="panel" open>
        <summary id="party-head"></summary>
        <ul id="members" class="members"></ul>
        <div class="roles">
          <label>Scout <select id="scout"></select></label>
          <label>Watchman <select id="watchman"></select></label>
          <label title="Hunting and Foraging, all day on the road: Perception + Wilderness, less the pace's penalty">Forager <select id="forager"></select></label>
          <label title="At camp: dry rations cooked in an iron pot make a hot meal, which adds to the night's rest">Cook <select id="cook"></select></label>
          <label title="Heals after each fight with Wound Kits, and treats Injuries at camp with Injury Kits">Healer <select id="healer"></select></label>
          <label title="At camp: repairs armor and shields with repair kits and a hammer">Smith <select id="smith"></select></label>
          <label title="What the Forager looks for. Healing herbs need the Healer discipline.">Forage for <select id="forage"><option value="meals">meals</option><option value="herbs">healing herbs</option></select></label>
        </div>
        <label class="small"><input type="checkbox" id="quiet"> Move quietly (at Slow pace)</label>
        <div id="pelts" class="muted small"></div>
      </details>
      <details class="panel" id="supplies-panel" open>
        <summary id="supplies-head">Supplies</summary>
        <div id="supplies" class="small"></div>
      </details>
      <div id="town" class="panel" hidden></div>
      <ol id="log" class="log"></ol>
    </aside>
  </main>
  <script type="module" src="game/main.js"></script>
</body>
</html>
